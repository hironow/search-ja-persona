# Dependabot version updates (first-party) — replaces Renovate (renovate.json
# removed). Dependabot security updates are enabled separately in the repo's
# security settings.
#
# Supply-chain hardening: a 7-day `cooldown` holds every routine bump until the
# new version has been public for a week, so a compromised-then-yanked release is
# not pulled in on day zero. Cooldown applies to version updates only —
# Dependabot SECURITY updates (vulnerability fixes) bypass it and still land fast.
#
# Ecosystems in this repo:
#   github-actions -> .github/workflows/*.yaml (SHA-pinned actions)
#   uv             -> root uv project (pyproject.toml + uv.lock; runtime deps)
#
# Out of scope: emulator/compose.yaml `image:` tags (stock images, hand-managed;
# Dependabot's docker ecosystem covers Dockerfiles only, and this repo has none).
#
# NOTE: filename uses `.yaml` per this repo's YAML convention. Reviewer: hironow.
version: 2

# One Dependabot pull request per week for the whole repo (owner ruling
# 2026-09-14): every ecosystem below joins the `weekly` group, whose schedule is
# this repo's slot on a weeknight JST (hub `just dependabot-slot <repo>`) — one CI
# run on the runner pool per repo per week instead of one per ecosystem, and no
# org-wide Monday burst. The per-ecosystem cooldown and labels are unchanged;
# commit-message and open-pull-requests-limit live on the group (Dependabot
# refuses them on the entries).
multi-ecosystem-groups:
  weekly:
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "15:10"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

updates:
  - package-ecosystem: "github-actions"
    patterns: ["*"]
    multi-ecosystem-group: "weekly"
    directory: "/"
    cooldown:
      default-days: 7
    labels: ["dependencies", "github-actions"]
  - package-ecosystem: "uv"
    patterns: ["*"]
    multi-ecosystem-group: "weekly"
    directory: "/"
    cooldown:
      default-days: 7
    labels: ["dependencies", "python"]
