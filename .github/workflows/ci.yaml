name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: prek hooks + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # CI is mise-independent (mise.toml is for local dev). uv comes from the
      # official action with a warm cache so the heavy sync (torch, onnxruntime,
      # sentence-transformers) is not repaid every run.
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # just is needed because the prek local hooks shell out to `just format` /
      # `just lint`; prek runs the same hook set git would run locally.
      - name: Install just and prek
        run: |
          uv tool install rust-just
          uv tool install prek
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint + format gate (prek hooks)
        run: prek run --all-files --show-diff-on-failure

      # --frozen: use the committed lock as-is (no re-resolution), so CI tests the
      # exact pinned versions and never rewrites uv.lock.
      - name: Unit tests
        run: uv run --frozen pytest -q

  windows:
    name: unit tests (windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The uv cache matters even more here: win32 resolves torch from the
      # CUDA index (multi-GB wheel), which this cache amortizes across runs.
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # Lint/format already gate on the ubuntu job; this leg guards the
      # Windows-specific behavior (paths, encodings, wheel sources).
      - name: Unit tests
        run: uv run --frozen pytest -q
