[project]
name = "search-ja-persona"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "hironow" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.0",
    "fastembed>=0.7.3",
    "onnxruntime>=1.28.0",
    "pandas>=3.0.3",
    "pyarrow>=25.0.0",
    "python-dotenv>=1.2.2",
    "aiohttp>=3.14.3",
    "rich>=15.0.0",
    "sentence-transformers>=5.6.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
norecursedirs = ["emulator"]
markers = [
    "integration: tests requiring running emulator services and cached datasets",
]

[tool.ruff]
exclude = [
    "emulator/",
    "marimo/",
]
